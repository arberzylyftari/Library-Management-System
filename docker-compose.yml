networks:
  library-net:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    networks: [library-net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library_docker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Host port deliberately not 5432 — avoids colliding with a native local
    # Postgres. Exposed only for optional host-side psql/debugging; the
    # other services reach this over the internal network as "postgres".
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: applies Prisma migrations, then exits. Built from the `builder`
  # stage of api/Dockerfile, which still has the prisma CLI (a devDependency
  # deliberately left out of the lean runtime image).
  migrate:
    build:
      context: ./api
      target: builder
    networks: [library-net]
    command: ["npm", "run", "migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-library_docker}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: runtime
    networks: [library-net]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-library_docker}?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Host port deliberately not 4000 — avoids colliding with the local
    # non-Docker "npm run dev" api server.
    ports:
      - "4001:4000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    networks: [library-net]
    depends_on:
      api:
        condition: service_healthy
    # Host port deliberately not 5173 — avoids colliding with the local
    # non-Docker "npm run dev" web server.
    ports:
      - "8080:80"
    restart: unless-stopped
