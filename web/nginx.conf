server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strips the /api prefix via the trailing slash on proxy_pass, mirroring
    # the dev-time Vite proxy's rewrite (the frontend only ever calls
    # relative /api/... URLs).
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (BrowserRouter) — fall back to index.html for
    # any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
