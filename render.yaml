databases:
  - name: library-db
    plan: free
    databaseName: library
    user: library

services:
  # Built from api/Dockerfile. Render's Docker builds don't support picking a
  # build stage, so this always builds the final "runtime" stage, exactly
  # the lean, production image the local docker-compose setup uses too.
  # That image deliberately has no Prisma CLI, so migrations are NOT run
  # here — run `npx prisma migrate deploy` from a local machine against this
  # database's external connection string instead (see README > Deployment).
  - type: web
    name: library-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5

  # Static build of the Vite SPA, served from Render's CDN rather than the
  # nginx Docker image used locally. The /api/* rewrite below reproduces
  # nginx's reverse proxy so the frontend's relative /api/... fetches keep
  # working unchanged. The destination is library-api's actual Render URL
  # (Render appended a suffix since the plain "library-api" name was taken).
  - type: web
    name: library-web
    runtime: static
    rootDir: ./web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://library-api-cwxz.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
